<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Peça — George Ricardo</title>
<link rel="stylesheet" href="marca.css">
<style>body{margin:0;background:#000}</style>
</head>
<body>

<!-- Textura granulada e ícones (pessoa, prédio) usados pelos exemplos -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter>
  <symbol id="i-person" viewBox="0 0 24 40"><circle cx="12" cy="7" r="6"/><path d="M2 40V23a10 10 0 0 1 20 0v17z"/></symbol>
  <symbol id="i-building" viewBox="0 0 30 40"><path fill-rule="evenodd" d="M0 0h30v40H0z M5 5h5v5H5z M13 5h4v5h-4z M20 5h5v5h-5z M5 14h5v5H5z M13 14h4v5h-4z M20 14h5v5h-5z M5 23h5v5H5z M13 23h4v5h-4z M20 23h5v5h-5z M12 31h6v9h-6z"/></symbol>
</svg>

<!-- Cole aqui UM <article class="post ..."> por peça. Cada id vira o nome do PNG. -->
<article class="post post--ig" id="peca-01">
  <svg class="grain"><rect width="100%" height="100%" filter="url(#grain)"/></svg>

  <h2 class="ig-title gradient-text">Título da peça com <span class="lv-highlight">destaque</span></h2>

  <div class="ig-body">
    <!-- corpo do formato escolhido -->
  </div>

  <div class="ig-footer">
    <div class="ig-avatar"><img class="ig-avatar__img" src="george-avatar.jpg" alt="George Ricardo"></div>
    <div class="ig-footer__id"><b>George Ricardo</b><span>@georgeric_</span></div>
    <div class="ig-footer__text">Pergunta ligada ao tema da peça?</div>
  </div>
</article>

</body>
</html>
